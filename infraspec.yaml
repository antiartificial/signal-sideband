name: signal-sideband
deploy: true

repo:
  url: https://github.com/antiartificial/signal-sideband.git
  branch: master
  autoDeploy: true
  repoWeb: https://github.com/antiartificial/signal-sideband

build:
  dockerfile: Dockerfile

processes:
  web:
    port: 3001
    command: ./signal-sideband
    health:
      path: /health
    scaling:
      min: 1
    resources:
      cpu: 25
      memory: 1024

secrets:
  - AUTH_PASSWORD
  - OPENAI_API_KEY
  - XAI_API_KEY
  - GEMINI_API_KEY
  - SIGNAL_URL
  - SIGNAL_API_URL
  - SIGNAL_NUMBER
  - DATABASE_URL
  - DB_PASSWORD

migrations: for f in migrations/*.sql; do psql -U norn -d signal_sideband -f "$f"; done

env:
  LLM_PROVIDER: xai
  DB_HOST: host.docker.internal
  DB_USER: norn
  DB_NAME: signal_sideband
  DB_PORT: "5432"
  API_PORT: "3001"
  MEDIA_PATH: /data/media
  XAI_VISION_MODEL: grok-4.3
  FILTER_GROUP_ID: vcTTcEjUcCM7Ugzdqw5nxt+P6K0hxs20FB8zpTJzibI=

infrastructure:
  postgres:
    database: signal_sideband

snapshots:
  keep: 3
  retentionEnabled: true

endpoints:
  - url: https://sideband.slopistry.com

volumes:
  - name: signal-sideband-media
    mount: /data/media
